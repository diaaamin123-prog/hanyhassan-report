<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كارت متابعة صيانة – هاني حسن</title>
<style>
:root{--k:#101312;--g:#0a8a2a;--r:#d61f1f;--bg:#eceeed;--bd:#d3d8d5;--mu:#5d6662;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--k);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;font-size:16px}
.wrap{max-width:640px;margin:0 auto;padding:12px}
.top{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;background:var(--k);color:#fff;border-radius:14px;padding:12px 14px 16px}
.top::after{content:"";position:absolute;inset:auto 0 0 0;height:5px;background:linear-gradient(90deg,var(--g) 50%,var(--r) 50%)}
.top img{height:36px;background:#fff;border-radius:6px;padding:2px}
.top h1{font-size:17px;margin:0;flex:1}
.top small{color:#b9c2be}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 14px;color:#fff;background:var(--g);cursor:pointer}
button.g{background:#444}button.r{background:var(--r)}button.w{background:#1da851}
.bx{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:10px}
.bx h2{font-size:15px;margin:0 0 8px}
small.l{display:block;color:var(--mu);font-size:13px;margin:8px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--k);background:#fafbfa;border:1px solid var(--bd);border-radius:8px;padding:10px}
textarea{min-height:84px}
input[readonly]{background:#eef1ef}
.res{max-height:250px;overflow:auto;margin-top:6px}
.it{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.it b{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--g)}
.it span{flex:1}.it small{color:var(--mu)}
.led{display:inline-block;background:#06110a;color:#3dff6b;font:700 32px ui-monospace,Menlo,Consolas,monospace;letter-spacing:4px;padding:4px 16px;border-radius:8px;box-shadow:inset 0 0 0 2px #1d3a26;direction:ltr}
.sel{display:flex;gap:12px;align-items:center}
.sel div b{display:block;font-size:17px}.sel div small{color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{flex:1 1 30%;text-align:center;border:1px solid var(--bd);background:#fafbfa;border-radius:8px;padding:10px 6px;cursor:pointer}
.chips input{display:none}
.chips label:has(input:checked){background:var(--k);color:#fff;border-color:var(--k)}
.row{display:flex;gap:8px}.row>*{flex:1}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btns .w{grid-column:1/3;font-size:18px}
#lock{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:20px;text-align:center}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;display:none}
#card{background:#fff;color:#101312;border-radius:12px;overflow:hidden;border:1px solid var(--bd);font-size:13px;line-height:1.6}
#card,#card *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
#card .ch{display:flex;justify-content:space-between;align-items:center;padding:10px 12px}
#card .ch img{height:54px}
#card .cn b{display:block;font-size:15px}#card .cn span{color:var(--g);font-weight:700}
#card .cb{display:flex;justify-content:space-between;background:#101312;box-shadow:inset 0 0 0 1000px #101312;color:#fff;font-weight:800;padding:7px 12px;border-bottom:4px solid var(--g)}
#card .cg{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:10px 12px}
#card .f small{display:block;color:#5d6662;font-size:11px}#card .f b{font-size:13.5px}
#card .f.w{grid-column:1/3}
#card .sm{margin:6px 12px;padding:6px 10px;border-right:4px solid #9aa5a0;background:#f3f5f4;box-shadow:inset 0 0 0 1000px #f3f5f4;min-height:44px;white-space:pre-wrap}
#card .sm.n{border-right-color:var(--g);background:#eaf6ec;box-shadow:inset 0 0 0 1000px #eaf6ec}
#card .sm small{display:block;color:#5d6662;font-size:11px}
#card .cf{margin-top:8px;padding:8px 12px;font-size:11px;color:#555;border-top:3px solid var(--r);box-shadow:0 -5px 0 var(--g)}
@media print{body{background:#fff}.wrap>*:not(#cw){display:none!important}#cw{border:0;padding:0;margin:0}#card{border:0}@page{size:A5;margin:8mm}}
</style>
</head>

const TY=['صيانة دورية','عطل','تحصيل','معاينة','انهاء ضمان'];
const $=id=>document.getElementById(id);
const norm=s=>(s||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/[ىئ]/g,'ي').replace(/ؤ/g,'و').replace(/[\u064B-\u0652]/g,'');
const NC=C.map(x=>norm(x.c+' '+x.n+' '+x.a));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dm=v=>{if(!v)return '';const[a,b,c]=v.split('-');return +c+'/'+(+b)+'/'+a};
const stamp=()=>new Date().toLocaleString('ar-EG',{weekday:'long',day:'numeric',month:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
const L=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){}return null};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1500)}
const sha=async s=>{try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('hh|'+s));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return ''}};
let R=L('estremote'),CU='',cur=null,qn=0;
const S=Object.assign({type:'',ntype:'',date:today(),ndate:'',prev:'',now:''},L('rptdraft')||{});
if(S.cc)cur=C.find(x=>x.c===S.cc)||null;
function gate(){const us=(R&&R.users)||[];let need=us.length>0;CU='';
 if(need){const c=L('estuser');const u=c&&us.find(x=>x.h===c.h);if(u){CU=u.n;need=false}}
 $('lock').style.display=need?'flex':'none';
 $('lo').style.display=CU?'':'none';$('who').textContent=CU?'الفني: '+CU:'';
 $('techw').innerHTML=CU?'<input readonly value="'+esc(CU)+'">':'<input id="tn" placeholder="اسم الفني" value="'+esc(S.tn||'')+'">';
 if(!CU)$('tn').oninput=()=>{S.tn=$('tn').value;sv();cardR()};
 cardR()}
function sv(){S.cc=cur?cur.c:'';L('rptdraft',S)}
const cnt=()=>L('rptcnt')||{};
const nextNo=()=>(cnt()[CU||S.tn||'—']||0)+1;
function commit(){if(!cur){toast('اختار العميل الأول');return false}
 if(!qn){const c=cnt(),k=CU||S.tn||'—';c[k]=(c[k]||0)+1;L('rptcnt',c);qn=c[k]}
 const h=L('rpthist')||{};h[cur.c]={d:S.date,s:S.now};L('rpthist',h);cardR();return true}
function chips(id,key){$(id).innerHTML=TY.map(t=>'<label><input type="radio" name="'+id+'" value="'+t+'"'+(S[key]===t?' checked':'')+'>'+t+'</label>').join('');
 $(id).querySelectorAll('input').forEach(i=>i.onchange=()=>{S[key]=i.value;sv();cardR()})}
function pick(x){cur=x;const h=(L('rpthist')||{})[x.c];S.prev=h&&h.s?h.s:'';$('pv').value=S.prev;$('q').value='';$('res').innerHTML='';sel();sv();cardR()}
function sel(){$('selw').style.display=cur?'flex':'none';if(cur){$('ledc').textContent=cur.c;$('seln').textContent=cur.n;$('sela').textContent=cur.a+' · الخط '+cur.l}}
$('q').oninput=()=>{const w=norm($('q').value).split(/\s+/).filter(Boolean);if(!w.length){$('res').innerHTML='';return}
 let h='',k=0;for(let i=0;i<C.length&&k<8;i++){if(w.every(x=>NC[i].includes(x))){k++;h+='<div class="it" data-i="'+i+'"><b>'+C[i].c+'</b><span>'+esc(C[i].n)+'<br><small>'+esc(C[i].a)+'</small></span></div>'}}
 $('res').innerHTML=h||'<small class="l">مفيش نتائج</small>'};
$('res').onclick=e=>{const d=e.target.closest('.it');if(d)pick(C[+d.dataset.i])};
const f=(l,v,w)=>'<div class="f'+(w?' w':'')+'"><small>'+l+'</small><b>'+esc(v)+'</b></div>';
const sm=(l,v,c)=>'<div class="sm'+(c?' '+c:'')+'"><small>'+l+'</small>'+esc(v||'—')+'</div>';
function cardR(){const c=cur,nm=CU||S.tn||'—';
 $('card').innerHTML='<div class="ch"><div class="cn"><b>م. هاني حسن للمصاعد</b><span>Hany Hassan Elevators</span></div><img src="'+LOGO+'" alt=""></div>'+
 '<div class="cb"><span>كارت متابعة صيانة</span><span>رقم '+(qn||nextNo())+'</span></div>'+
 '<div class="cg">'+f('اسم العميل',c?c.n:'—',1)+f('الكود',c?c.c:'—')+f('الخط',c?c.l:'—')+f('العنوان',c?c.a:'—',1)+f('الفني',nm)+f('التاريخ',dm(S.date))+f('نوع التقرير',S.type||'—',1)+'</div>'+
 sm('الملخص السابق',S.prev)+sm('الملخص الحالي',S.now,'n')+
 '<div class="cg">'+f('المتابعة التالية',S.ntype||'—')+f('تاريخها',dm(S.ndate)||'—')+'</div>'+
 '<div class="cf">أعدّه: '+esc(nm)+' | '+stamp()+'</div>'}
function text(){const c=cur||{};return ['*كارت متابعة صيانة – هاني حسن للمصاعد*','رقم: '+(qn||nextNo()),'العميل: '+(c.n||''),'الكود: '+(c.c||''),'العنوان: '+(c.a||''),'الفني: '+(CU||S.tn||''),'التاريخ: '+dm(S.date),'نوع التقرير: '+S.type,'','الملخص السابق: '+S.prev,'الملخص الحالي: '+S.now,'','المتابعة التالية: '+S.ntype+' '+dm(S.ndate),'',stamp()].join('\n')}
$('dt').onchange=()=>{S.date=$('dt').value;sv();cardR()};$('nd').onchange=()=>{S.ndate=$('nd').value;sv();cardR()};
$('pv').oninput=()=>{S.prev=$('pv').value;sv();cardR()};$('nw').oninput=()=>{S.now=$('nw').value;sv();cardR()};
$('wa').onclick=()=>{if(!commit())return;const n=String((R&&R.wa)||'').replace(/\D/g,'');window.open('https://wa.me/'+n+'?text='+encodeURIComponent(text()),'_blank')};
$('cp').onclick=async()=>{if(!commit())return;try{await navigator.clipboard.writeText(text());toast('تم النسخ')}catch(e){toast('تعذر النسخ')}};
$('pr').onclick=()=>{if(!commit())return;const old=document.title;document.title=(cur.c+' - '+cur.n).replace(/[\/:*?"<>|]/g,'-');const rs=()=>{document.title=old;removeEventListener('afterprint',rs)};addEventListener('afterprint',rs);print()};
$('nw2').onclick=()=>{if(!confirm('بدء متابعة جديدة؟'))return;cur=null;qn=0;Object.assign(S,{type:'',ntype:'',date:today(),ndate:'',prev:'',now:'',cc:''});fill();sel();cardR();sv()};
$('ll').onclick=async()=>{const h=await sha($('lc').value.trim());const u=((R&&R.users)||[]).find(x=>x.h===h);if(!u)return toast('الكود غير صحيح');L('estuser',{h});$('lc').value='';gate()};
$('lc').onkeydown=e=>{if(e.key==='Enter')$('ll').click()};
$('lo').onclick=()=>{L('estuser',null);qn=0;gate()};
function fill(){$('dt').value=S.date;$('nd').value=S.ndate;$('pv').value=S.prev;$('nw').value=S.now;chips('t1','type');chips('t2','ntype')}
fill();sel();gate();
fetch(location.origin+'/hanyhassan/prices.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.items){R=d;L('estremote',d);gate()}}).catch(()=>{});
